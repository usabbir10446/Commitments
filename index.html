
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Task Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Polyfills for older browsers (Android 5.0 compatibility) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.32.1/minified.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fetch/3.6.18/fetch.min.js"></script>
    
    <script>
        // Polyfill process for libraries that expect it
        window.process = { env: { NODE_ENV: 'production' } };
        
        // Error reporting to UI for easier debugging on older mobile devices
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Global Error:', msg, url, lineNo, columnNo, error);
            const root = document.getElementById('root');
            // Only show error overlay if the app hasn't mounted successfully
            if (root && (root.innerHTML.includes('Loading Scheduler...') || root.innerHTML.trim() === '')) {
                root.innerHTML = '<div style="padding: 40px; color: #e11d48; font-family: sans-serif; text-align: center; background: #fff; height: 100vh;">' +
                    '<h2 style="font-weight: 900; margin-bottom: 8px;">Launch Error</h2>' +
                    '<p style="opacity: 0.7; font-size: 13px; margin-bottom: 24px; line-height: 1.5;">The application could not start. This might be due to an incompatible browser version or a network issue.</p>' +
                    '<div style="background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 11px; text-align: left; overflow: auto; margin-bottom: 24px;">' + msg + '</div>' +
                    '<button onclick="location.reload()" style="padding: 14px 28px; background: #4f46e5; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">Try Again</button>' +
                    '</div>';
            }
            return false;
        };
    </script>

    <!-- es-module-shims enables importmaps and ESM in legacy browsers like Android 5.0 -->
    <script src="https://esm.sh/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            background-color: #f8fafc;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        ::-webkit-scrollbar {
            display: none;
        }
        /* Fallback for backdrop-filter on older Android versions */
        @supports not (backdrop-filter: blur(1px)) {
            .backdrop-blur-md {
                background-color: rgba(248, 250, 252, 0.98) !important;
            }
            .backdrop-blur-xl {
                background-color: rgba(255, 255, 255, 0.99) !important;
            }
        }
    </style>

    <!-- 
      We use a single importmap-shim to ensure consistent behavior across browsers.
    -->
    <script type="importmap-shim">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0?target=es2015",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom": "https://esm.sh/react-dom@19.0.0?target=es2015",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client?target=es2015",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "lucide-react": "https://esm.sh/lucide-react@0.463.0?target=es2015",
        "html2canvas": "https://esm.sh/html2canvas@1.4.1?target=es2015",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4?target=es2015"
      }
    }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.93.2"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root">
        <!-- Initial mounting state -->
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc;">
            <div style="text-align: center;">
                <div style="width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top: 3px solid #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;"></div>
                <p style="font-family: 'Inter', sans-serif; font-weight: 700; color: #64748b; font-size: 13px; letter-spacing: -0.01em;">Loading Scheduler...</p>
            </div>
        </div>
    </div>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- Main Entry Point -->
    <script type="module-shim" src="index.tsx"></script>
</body>
</html>
