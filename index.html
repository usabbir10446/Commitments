    <script>
        // Polyfill process for libraries that expect it in a browser environment
        window.process = { env: { NODE_ENV: 'production' } };
        
        // Simple error reporting to help identify issues in deployed environments
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Handled Error: ', msg, url, lineNo, columnNo, error);
            return false;
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        ::-webkit-scrollbar {
            display: none;
        }
        /* Custom class to hide elements during capture */
        .hide-during-capture {
            display: none !important;
        }
    </style>
